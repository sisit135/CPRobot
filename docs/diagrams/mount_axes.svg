<svg xmlns="http://www.w3.org/2000/svg" width="680" height="570" viewBox="0 0 680 570" role="img" aria-labelledby="title desc">
<title id="title">Mounting coordinates: X right, Y forward</title>
<desc id="desc">Top view of the 190 mm diagonal square platform. Both wheel centers sit at Y minus 24 mm, below the platform origin. Both side ToFs sit at Y plus 22.5 mm. Tire edges remain inside the platform sides.</desc>
