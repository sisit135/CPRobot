syntax = "proto3";
package generic.field.tool.v1;
// Stream and typed SPI kinds: 9 command, 10 response, 11 sensor sample.
// The complete encoded envelope must fit in 238 bytes. No fragmentation/retry.
message Envelope {
  uint32 request_id = 1; // Nonzero for commands/responses; echoed by target.
  string type = 2; // Fully qualified protobuf message name.
  bytes payload = 3; // Serialized message of that type.
}
