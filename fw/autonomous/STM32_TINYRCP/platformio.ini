[platformio]
extra_configs =

[env:blackpill_f411ce]
platform = ststm32
board = blackpill_f411ce
framework = arduino
lib_deps = stm32duino/STM32duino FreeRTOS@^10.3.3
build_unflags = -std=gnu++11 -std=gnu++14
build_flags =
    -std=gnu++17
    -I../../robot_sf/include
    -I../../robot_sf/include/motor_control
    -Isrc/hal/vendor
extra_scripts = pre:scripts/platformio_sources.py

[env:blackpill_f411ce_cmsis]
extends = env:blackpill_f411ce
build_flags = ${env:blackpill_f411ce.build_flags}
    -DLOC_USE_CMSIS_DSP
    -DARM_MATH_CM4

; Example telemetry wiring only: verify SPI1/CS/READY pinout on your board.
[env:blackpill_f411ce_telemetry]
extends = env:blackpill_f411ce
build_flags = ${env:blackpill_f411ce.build_flags}
    -DAXI_TELEMETRY_SPI_ENABLE
    -DAXI_SPI_CS_PIN=PA4
    -DAXI_SPI_READY_PIN=PB0
    -DAXI_LOC_KEY_PIN=PB1

; Add -DAXI_LOG_SERIAL_ENABLE in a local debug environment to enable the deferred UART sink.

[env:blackpill_f411ce_remote]
extends = env:blackpill_f411ce_telemetry
build_flags = ${env:blackpill_f411ce_telemetry.build_flags}
    -DAXI_REMOTE_CONFIG_ENABLE
    -DLFS_NO_DEBUG
    -DLFS_NO_WARN
    -DLFS_NO_ERROR
    -I../../../third_party/littlefs
extra_scripts = pre:scripts/platformio_sources.py
board_upload.maximum_size = 131072
