[platformio]
default_envs = blackpill_f411ce
extra_configs =

[env:blackpill_f411ce]
platform = ststm32
board = blackpill_f411ce
framework = arduino
lib_deps = stm32duino/STM32duino FreeRTOS@^10.3.3
build_unflags = -std=gnu++11 -std=gnu++14
build_flags =
    -std=gnu++17
    -g3

    -DNAV_TURN_GUARD=1
    -DNAV_NONSTOP_TURN=1
    -DAXI_PLATFORM_V2=1

    -I../../robot_sf/include
    -I../../robot_sf/include/motor_control
    -Isrc/hal/vendor
    -DAXI_TELEMETRY_SPI_ENABLE
    -DAXI_SPI_CS_PIN=PA4
    -DAXI_SPI_READY_PIN=PB0
    -DAXI_LOC_KEY_PIN=PB1
    -DAXI_LOG_SERIAL_ENABLE
    -DAXI_LOG_RTT_ENABLE
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -DLFS_NO_DEBUG
    -DLFS_NO_WARN
    -DLFS_NO_ERROR
extra_scripts = pre:scripts/platformio_sources.py
; Sectors 0-5 hold the application; sectors 6-7 hold mandatory settings.
board_upload.maximum_size = 262144
monitor_speed = 115200

[env:blackpill_f411ce_cmsis]
extends = env:blackpill_f411ce
build_flags = ${env:blackpill_f411ce.build_flags}
    -DLOC_USE_CMSIS_DSP
    -DARM_MATH_CM4

; Compatibility aliases. Remote configuration is present in every profile.
; Verify example SPI1/CS/READY/key wiring on the assembled board.
[env:blackpill_f411ce_telemetry]
extends = env:blackpill_f411ce
build_flags = ${env:blackpill_f411ce.build_flags}
    -DAXI_TELEMETRY_SPI_ENABLE
    -DAXI_SPI_CS_PIN=PA4
    -DAXI_SPI_READY_PIN=PB0
    -DAXI_LOC_KEY_PIN=PB1

; Serial maps to USB CDC; startup never waits for a host connection.

[env:blackpill_f411ce_remote]
extends = env:blackpill_f411ce_telemetry


[env:blackpill_f411ce_trace]
extends = env:blackpill_f411ce
build_flags = ${env:blackpill_f411ce.build_flags}
    -DAXI_TELEMETRY_SPI_ENABLE
    -DAXI_VENDOR_TRACE_ENABLE
    -DVL53L0X_LOG_ENABLE
    -include time.h
    -ULFS_NO_DEBUG
    -ULFS_NO_WARN
    -ULFS_NO_ERROR

[env:blackpill_f411ce_prod]
extends = env:blackpill_f411ce
build_flags = ${env:blackpill_f411ce.build_flags}
    -include time.h

; Shortened platform, original wheel and side-ToF mounts.
[env:blackpill_f411ce_v2]
extends = env:blackpill_f411ce
build_flags = ${env:blackpill_f411ce.build_flags}

; Explicit hardware-test profile: full PWM and rolling turns for FEATURE/RHR.
[env:blackpill_f411ce_v2_rolling_test]
extends = env:blackpill_f411ce_v2
build_unflags = ${env:blackpill_f411ce.build_unflags}
    -DNAV_TURN_GUARD=1
build_flags = ${env:blackpill_f411ce_v2.build_flags}
    -DNAV_TURN_GUARD=0
    -DROBOT_MAX_SPEED_ROLLING_TEST=1

; Continuous turns, with normal speed caps, approach control and motor ramp.
[env:blackpill_f411ce_v2_nonstop_turn_test]
extends = env:blackpill_f411ce_v2
build_unflags = ${env:blackpill_f411ce.build_unflags}
    -DNAV_TURN_GUARD=1
build_flags = ${env:blackpill_f411ce_v2.build_flags}
    -DNAV_TURN_GUARD=0
