syntax = "proto3";
package axi.telemetry.v1;

// Typed telemetry carried unchanged across SPI, BLE NUS, and TLS.
message EkfLog {
  uint32 boot_id = 1;
  uint64 monotonic_us = 2;
  uint32 sequence = 3;
  float x_m = 4;
  float y_m = 5;
  float yaw_rad = 6;
  float gyro_bias_rps = 7;
  float sigma_x_m = 8;
  float sigma_y_m = 9;
  float sigma_yaw_rad = 10;
  sint32 grid_x = 11;
  sint32 grid_y = 12;
  bool tracking = 13;
  bool grid_confident = 14;
  uint32 queue_dropped = 15;
}

// Deferred RCP log collector record; SPI typed kind 7.
message LogRecord {
  uint32 timestamp_ms = 1;
  uint32 level = 2;
  string source = 3;
  string message = 4;
  uint32 collector_dropped = 5;
}

message Control {
  uint32 request_id = 1;
  // 1 = start map resolution/localization; 2 = latched halt.
  uint32 operation = 2;
}

message ControlAck {
  uint32 request_id = 1;
  uint32 operation = 2;
  // 0 = accepted; 1 = denied; 2 = invalid; 3 = bridge busy; 4 = SPI not ready.
  uint32 status = 3;
}

// BLE-only transport discovery over an encrypted, bonded connection.
message LinkInfo {
  uint32 request_id = 1;
  string ipv6_linklocal = 2;
  string certificate_sha256 = 3;
  uint32 port = 4;
  string device_id = 5;
}
